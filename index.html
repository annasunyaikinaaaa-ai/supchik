<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Супчик">
<meta name="theme-color" content="#F4F4F4">
<title>Супчик</title>
<!-- новое имя файла, чтобы айфон не взял старую иконку из памяти -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<!-- шрифты лежат рядом с сайтом, чтобы не зависеть от Google Fonts -->
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --bg: #F4F4F4;
    --card: #FFFFFF;
    --ink: #141414;
    --muted: #666666;
    --line: #E2E2E2;
    --accent: #FFD400;
    --home: #FF7A5C;
    --asia: #6CD48A;
    --east: #5CC8FF;
    --euro: #B79CFF;
    --own: #E2E2E2;
    --display: "Dela Gothic One", "Arial Black", sans-serif;
    --text: "Onest", -apple-system, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 24px; }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }

  .app { overflow-x: clip; max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 80px); min-height: 100vh; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* типографика */
  .display-xl { font-family: var(--display); font-size: 128px; line-height: 128px; letter-spacing: -4px; }
  .display-l { font-family: var(--display); font-size: 40px; line-height: 44px; }
  .display-m { font-family: var(--display); font-size: 32px; line-height: 40px; }
  .h3 { font-size: 20px; line-height: 28px; font-weight: 700; }
  .caption { font-size: 12px; line-height: 16px; color: var(--muted); }
  .muted { color: var(--muted); }

  /* Сегодня */
  .today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; white-space: nowrap; }
  #s-today.active { display: flex; flex-direction: column; min-height: calc(100dvh - 104px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  /* большая цветная карточка: жёлтая до супа, цвета категории после */
  .today-card { --hb: 40px; --hs: 420px; position: relative; overflow: hidden; flex: 1; min-height: 320px; margin-top: 24px; padding: 16px 16px 8px; border-radius: 24px; background: linear-gradient(180deg, #FFD400 0%, #FFF5C6 100%); display: flex; flex-direction: column; }
  .today-card.has-eaten { --hb: 136px; --hs: 340px; padding-bottom: 88px; }
  .today-phrase { position: relative; z-index: 0; font-size: 32px; line-height: 40px; }
  .today-phrase.big { font-size: 40px; line-height: 44px; }
  /* суп всегда одного размера; на длинной фразе может залезть на текст, это нормально */
  .hero { position: absolute; z-index: 1; left: 50%; bottom: var(--hb); width: var(--hs); height: var(--hs); margin-left: calc(var(--hs) / -2); pointer-events: none; }
  .has-eaten .hero { pointer-events: auto; cursor: pointer; }
  .hero img { width: 100%; height: 100%; object-fit: contain; }
  .hero.pop img { animation: pop 400ms cubic-bezier(.3,1.6,.5,1); }
  /* облачко всегда над краем тарелки, не зависит от длины фразы */
  .bubble { position: absolute; z-index: 3; left: 16px; bottom: calc(var(--hb) + var(--hs) * 0.76); background: var(--card); border-radius: 12px; padding: 16px; font-weight: 700; font-size: 20px; line-height: 28px; text-align: left; }
  .bubble::before, .bubble::after { content: ""; position: absolute; border-radius: 50%; background: var(--card); }
  .bubble::before { width: 20px; height: 20px; left: 32px; top: calc(100% + 8px); }
  .bubble::after { width: 16px; height: 16px; left: 48px; top: calc(100% + 32px); }
  .bubble:active { transform: scale(0.96); }
  .streak { position: relative; z-index: 2; margin-top: auto; align-self: center; pointer-events: none; display: flex; align-items: flex-end; gap: 4px; }
  .streak-label { padding-bottom: 16px; font-weight: 500; white-space: nowrap; }
  /* трёхзначная серия: цифра поменьше, чтобы подпись влезла в одну строку */
  .streak .display-xl.long { font-size: 96px; line-height: 96px; letter-spacing: -4px; }
  .streak .display-xl.long + .streak-label { padding-bottom: 8px; }
  .eaten { position: relative; z-index: 4; margin-top: -88px; display: flex; gap: 16px; align-items: center; background: var(--card); border-radius: 16px; padding: 20px 16px; }
  .eaten .h3 { margin-top: 4px; }
  .link { color: var(--muted); text-decoration: underline; text-underline-offset: 4px; font-size: 16px; line-height: 24px; padding: 8px 0; }
  .main-btn { width: 100%; height: 64px; border-radius: 16px; background: var(--accent); font-weight: 700; font-size: 20px; line-height: 28px; }
  .main-btn:active { transform: scale(0.96); }
  .today-actions { margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #eat-btn { background: var(--ink); color: #FFFFFF; }
  .bounce { animation: bounce 480ms cubic-bezier(.3,1.6,.5,1); }
  @keyframes bounce { 0% { transform: scale(1); } 40% { transform: scale(0.92); } 100% { transform: scale(1); } }

  /* плашка подарка: ярко-розовая, такого цвета больше нигде нет. Чёрный текст на ней 6,9:1 */
  .gift-card { margin-top: 32px; width: 100%; display: flex; align-items: center; gap: 16px; background: linear-gradient(180deg, #FF4FA3 0%, #FFABD3 100%); color: var(--ink); border-radius: 24px; padding: 16px; text-align: left; }
  .gift-card .caption { color: var(--ink); }
  .backup-card { margin-top: 8px; width: 100%; display: flex; align-items: center; gap: 12px; background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 16px; text-align: left; }
  .backup-card .caption { color: var(--muted); display: block; margin-top: 4px; }
  /* плашка жизни: как подарок, только меньше и спокойнее */
  .life-card { margin-top: 8px; width: 100%; display: flex; align-items: center; gap: 12px; background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px 16px; text-align: left; box-shadow: inset 0 0 0 2px #FF4FA3; }
  .life-card .caption { color: var(--muted); }
  .heart { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .heart.empty { filter: grayscale(1); opacity: 0.32; }
  .heart.big { width: 160px; height: 160px; }
  .lives-box { background: var(--card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .lives-head { display: flex; align-items: center; gap: 12px; }
  .lives { display: flex; flex-wrap: wrap; gap: 4px; }

  /* персонаж-заглушка */
  .char { flex: none; border-radius: 16px; display: grid; place-items: center; }
  .char svg { width: 72%; height: 72%; }
  .char img { width: 96%; height: 96%; object-fit: contain; }
  .char-64 { width: 64px; height: 64px; }
  .char-40 { width: 40px; height: 40px; border-radius: 12px; }
  .char-128 { width: 128px; height: 128px; border-radius: 24px; }

  /* Супостат */
  .page-title { margin-bottom: 24px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card); border-radius: 24px; padding: 16px; }
  .stat.wide { grid-column: span 2; display: flex; justify-content: space-between; align-items: flex-end; padding: 24px; }
  .stat .num { font-family: var(--display); font-size: 48px; line-height: 48px; margin-top: 8px; }
  .stat.wide .num { font-size: 80px; line-height: 80px; }
  .record { text-align: right; }

  .cal { margin-top: 8px; background: var(--card); border-radius: 24px; padding: 16px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-nav { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; }
  .cal-nav:disabled { opacity: 0.32; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: 12px; line-height: 16px; color: var(--muted); padding-bottom: 4px; }
  .cal-day { aspect-ratio: 1; border-radius: 12px; background: var(--bg); font-size: 12px; line-height: 16px; font-weight: 500; display: grid; place-items: center; }
  .cal-day.future { background: transparent; color: #BDBDBD; }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--ink); }
  /* день, который спасла жизнь */
  .cal-day.frozen { background: transparent; box-shadow: inset 0 0 0 2px #FF4FA3; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  /* База супоеда */
  .base-sub { margin-top: -16px; margin-bottom: 24px; }
  .year-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: var(--card); border-radius: 24px; padding: 8px; }
  .year-nav .cal-nav { background: var(--bg); }
  .totals { margin-bottom: 8px; }
  .top-soup { display: flex; gap: 16px; align-items: flex-end; background: var(--card); border-radius: 24px; padding: 16px; }
  .top-soup .num { font-family: var(--display); font-size: 64px; line-height: 64px; }
  .rating { margin-top: 8px; background: var(--card); border-radius: 24px; padding: 8px 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-name { flex: 1; font-weight: 500; }
  .row-count { font-family: var(--display); font-size: 20px; line-height: 28px; }
  .section-title { margin: 32px 0 12px; }
  .gifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gift-slot { min-height: 120px; border-radius: 16px; background: var(--card); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; }
  .gift-slot .t { font-weight: 700; font-size: 16px; line-height: 20px; }
  .gift-slot.locked { background: transparent; border: 2px dashed #BDBDBD; }
  .gift-slot.ready { background: linear-gradient(180deg, #FF4FA3 0%, #FFABD3 100%); color: var(--ink); }
  .gift-slot .num { font-family: var(--display); font-size: 24px; line-height: 28px; }
  .gift-slot.opened { background: linear-gradient(180deg, #FFD400 0%, #FFF5C6 100%); }
  .gift-slot.opened .caption { color: var(--ink); }
  .coupon { margin: 24px 0; padding: 24px; border: 2px dashed var(--ink); border-radius: 24px; background: var(--accent); display: flex; flex-direction: column; gap: 16px; text-align: left; }
  .coupon .caption { color: var(--ink); }
  .coupon .display-m { font-size: 24px; line-height: 32px; }
  .meme-ph { background: var(--line); border-radius: 16px; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 12px; line-height: 16px; padding: 8px; flex: 1; margin-bottom: 8px; }
  .backup { display: flex; gap: 8px; }
  .sec-btn { flex: 1; height: 48px; border-radius: 16px; background: var(--card); font-weight: 500; }
  .empty { background: var(--card); border-radius: 24px; padding: 24px; }

  /* нижняя панель */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .tabbar-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted); font-weight: 500; }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--ink); }

  /* шторка */
  .overlay { position: fixed; inset: 0; background: rgba(20,20,20,0.48); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 32px 32px 0 0; padding: 24px 16px calc(env(safe-area-inset-bottom) + 24px); animation: up 240ms ease-out; }
  @keyframes up { from { transform: translateY(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .close { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; flex: none; }
  .label { margin: 24px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 40px; padding: 0 16px; border-radius: 12px; background: var(--bg); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .chip.on { background: var(--ink); color: #FFFFFF; }
  .chip i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .day-chip { flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .day-chip b { font-size: 20px; line-height: 28px; }
  .day-chip span { font-size: 12px; line-height: 16px; }
  .day-chip.on { background: var(--ink); color: #FFFFFF; }
  .day-chip { position: relative; }
  .day-chip.has::after { content: ""; position: absolute; bottom: 4px; left: 50%; margin-left: -2px; width: 4px; height: 4px; border-radius: 4px; background: currentColor; }
  .soups { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .soup-btn { min-height: 56px; border-radius: 16px; padding: 8px 12px; text-align: left; font-weight: 500; display: flex; align-items: center; gap: 8px; background: var(--bg); }
  .soup-btn:active { transform: scale(0.96); }
  .own-form { display: flex; flex-direction: column; gap: 8px; }
  .input { height: 48px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); padding: 0 16px; font-size: 16px; }
  .input:focus { outline: none; border-color: var(--ink); }
  .remove { margin-top: 24px; color: #C62828; font-weight: 500; padding: 8px 0; }

  /* подарок */
  .gift-stage { width: 100%; max-width: 440px; margin: auto 16px; background: var(--card); border-radius: 32px; padding: 32px 24px 24px; text-align: center; animation: up 240ms ease-out; align-self: center; }
  .box { width: 160px; height: 160px; margin: 24px auto; }
  .shake { animation: shake 1200ms ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes shake { 0%, 60%, 100% { transform: rotate(0); } 66% { transform: rotate(-8deg); } 74% { transform: rotate(8deg); } 82% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } }
  .pop { animation: pop 400ms cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .meme-big { aspect-ratio: 1; margin: 24px 0; }
  .meme-big img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }

  /* мем или факт дня */
  .treat-img { margin: 24px 0; }
  .treat-img img { display: block; width: 100%; max-height: 56vh; object-fit: contain; border-radius: 16px; background: var(--bg); }
  .treat-fact { margin: 24px 0; padding: 24px; border-radius: 24px; background: var(--bg); text-align: left; }
  .treat-fact .h3 { font-weight: 500; }
  .treat-link { font-weight: 500; color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 360px) {
    .display-xl { font-size: 112px; line-height: 112px; }
    .display-l { font-size: 32px; line-height: 40px; }
  }
</style>
</head>
<body>
<main class="app">

  <!-- Сегодня -->
  <section class="screen active" id="s-today">
    <div class="today-head">
      <span class="h3" id="hello">Привет</span>
      <span class="muted" id="today-date"></span>
    </div>
    <div class="today-card" id="today-card">
      <h1 class="display-l today-phrase" id="phrase"></h1>
      <button class="bubble" id="bubble" hidden>забери мою мудрость</button>
      <div class="hero" id="hero"></div>
      <div class="streak">
        <span class="display-xl" id="streak-num">0</span>
        <span class="streak-label" id="streak-label">дней я&nbsp;ел суп!!</span>
      </div>
    </div>
    <div id="eaten-slot"></div>
    <div id="gift-slot-today"></div>
    <div id="life-slot-today"></div>
    <div id="backup-slot-today"></div>
    <div class="today-actions">
      <button class="main-btn" id="eat-btn">Съесть ещё супа!</button>
    </div>
  </section>

  <!-- Супостат -->
  <section class="screen" id="s-stats">
    <h1 class="display-m page-title">Супостат</h1>
    <div class="stat-grid">
      <div class="stat wide">
        <div>
          <div class="muted">Серия сейчас</div>
          <div class="num" id="st-streak">0</div>
          <div class="caption" id="st-streak-cap">дней подряд</div>
        </div>
        <div class="record">
          <div class="muted">Рекорд</div>
          <div class="h3" id="st-record">0</div>
        </div>
      </div>
      <div class="stat">
        <div class="muted">На этой неделе</div>
        <div class="num" id="st-week">0</div>
        <div class="caption" id="st-week-cap">из 7 дней</div>
      </div>
      <div class="stat">
        <div class="muted" id="st-month-label">В этом месяце</div>
        <div class="num" id="st-month">0</div>
        <div class="caption" id="st-month-cap">дней с супом</div>
      </div>
    </div>
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="Прошлый месяц"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="h3" id="cal-title"></span>
        <button class="cal-nav" id="cal-next" aria-label="Следующий месяц"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <!-- База супоеда -->
  <section class="screen" id="s-base">
    <h1 class="display-m page-title">База супоеда</h1>
    <p class="muted base-sub">Суп это база</p>
    <div class="year-nav">
      <button class="cal-nav" id="year-prev" aria-label="Прошлый год"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="h3" id="year-title"></span>
      <button class="cal-nav" id="year-next" aria-label="Следующий год"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="rating-slot"></div>
    <h2 class="h3 section-title">Жизни</h2>
    <div class="lives-box" id="lives-box"></div>
    <h2 class="h3 section-title">Подарки за&nbsp;серии</h2>
    <div class="gifts" id="gifts"></div>
    <h2 class="h3 section-title">Копия данных</h2>
    <p class="muted" style="margin-bottom:16px">Сохрани копию раз в&nbsp;месяц, чтобы статистика не&nbsp;потерялась</p>
    <div class="backup">
      <button class="sec-btn" id="export-btn">Сохранить копию</button>
      <button class="sec-btn" id="import-btn">Загрузить</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<nav class="tabbar">

const KEY = 'supchik-v1';
let state = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.log) return Object.assign({ custom: [], opened: [], recent: [], treats: {}, seenM: [], seenF: [], claimed: {}, saves: {} }, s);
  } catch (e) {}
  return { log: {}, custom: [], opened: [], recent: [], treats: {}, seenM: [], seenF: [], claimed: {}, saves: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------- даты ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const daysWord = n => plural(n, 'день', 'дня', 'дней');

/* неразрывный пробел после коротких слов, чтобы они не висели в конце строки */
const SHORT = 'в|и|с|к|у|о|а|я|на|по|за|от|до|из|не|но|для|ты|же|ли|бы|ни|во|со|об|это|что|без|при|раз';
function nb(t) {
  /* смотрим назад без захвата, поэтому работает и для нескольких коротких слов подряд: «я в шоке» */
  return t.replace(new RegExp(`(?<=^|[\\s\\u00A0])(${SHORT}) `, 'gi'), '$1\u00A0');
}
/* осветлить цвет к белому: для градиента карточки */
function tint(hex, k) {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * k));
  return '#' + ch.map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ---------- подсчёты ---------- */
/* ---------- серии и жизни ----------
   На каждом 10-м дне супа подряд появляется жизнь. Её нужно забрать (кнопка на главном), тогда она лежит в копилке.
   Если день пропущен и в копилке есть жизнь, приложение спрашивает: потратить жизнь или начать серию заново.
   Спасённый день супом не считается, серия просто не прерывается.
   state.claimed: { дата 10-го дня: дата, когда забрал }; state.saves: { пропущенный день: 'use' | 'skip' }. */
const LIVE_EVERY = 10;
function chains() {
  const keys = Object.keys(state.log).sort();
  const res = { run: 0, frozen: new Set(), runs: [], milestones: [], used: new Set(), lives: 0, unclaimed: [], pending: null };
  if (!keys.length) return res;
  const claimed = state.claimed || {};
  const t = today(), tk = keyOf(t);
  const mark = k => { res.run++; if (res.run % LIVE_EVERY === 0) res.milestones.push(k); };
  for (let d = fromKey(keys[0]); d < t; d = addDays(d, 1)) {
    const k = keyOf(d);
    if (state.log[k]) { mark(k); continue; }
    /* пропуск: собираем все пропущенные дни подряд до следующего супа (или до сегодня) */
    const gap = [];
    for (let g = d; g < t && !state.log[keyOf(g)]; g = addDays(g, 1)) gap.push(keyOf(g));
    const free = res.milestones.filter(m => claimed[m] && !res.used.has(m));
    const canSave = free.length >= gap.length;
    const choice = (state.saves || {})[gap[0]];
    const recent = gap[gap.length - 1] === keyOf(addDays(t, -1));   /* спрашиваем только про пропуск, который закончился вчера */
    if (res.run > 0 && choice === 'use' && canSave) {
      free.slice(0, gap.length).forEach(m => res.used.add(m));
      gap.forEach(x => res.frozen.add(x));
    } else if (res.run > 0 && !choice && recent) {
      /* ещё не решил: показываем серию как есть и спрашиваем (спасти жизнью, «я вообще-то ел» или начать заново) */
      if (canSave) { free.slice(0, gap.length).forEach(m => res.used.add(m)); gap.forEach(x => res.frozen.add(x)); }
      res.pending = { day: gap[0], days: gap.length, run: res.run, canSave, lives: free.length };
    } else { if (res.run) res.runs.push(res.run); res.run = 0; }
    d = addDays(fromKey(gap[gap.length - 1]), 0);
  }
  if (state.log[tk]) mark(tk);
  if (res.run) res.runs.push(res.run);
  res.lives = res.milestones.filter(m => claimed[m] && !res.used.has(m)).length;
  res.unclaimed = res.milestones.filter(m => !claimed[m]);
  return res;
}
const currentStreak = () => chains().run;
const allStreaks = () => chains().runs;
const recordStreak = () => Math.max(0, ...allStreaks());
const giftsEarned = () => PRIZES.filter(p => recordStreak() >= p.days).length;
const pendingGift = () => { for (let i = 1; i <= giftsEarned(); i++) if (!state.opened.includes(i)) return i; return 0; };
function daysSinceLast() {
  const keys = Object.keys(state.log).sort();
  if (!keys.length) return null;
  return Math.round((today() - fromKey(keys[keys.length - 1])) / 86400000);
}

/* ---------- случайное, но стабильное в течение дня ---------- */
function seeded(seedStr) {
  let h = 0; for (const c of seedStr) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return () => { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
}
let rnd = seeded(keyOf(today()));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
let nickToday = pick(NICKS);
function fill(t, s) {
  return t.replace('{N}', cap(nickToday)).replace('{n}', nickToday).replace('{S}', `${s} ${daysWord(s)}`);
}
let phraseCache = null;

function choosePhrase() {
  const t = keyOf(today());
  const entry = state.log[t];
  const s = currentStreak();
  if (entry) {
    if (PHRASES.special[entry.name] && rnd() < 0.6) return pick(PHRASES.special[entry.name]);
    if (s >= 7 && rnd() < 0.3) return pick(PHRASES.long);
    if (PHRASES.cat[entry.cat] && rnd() < 0.4) return pick(PHRASES.cat[entry.cat]);
    return pick(PHRASES.done);
  }
  { const c = chains(); if (c.frozen.has(keyOf(addDays(today(), -1))) && !c.pending) return pick(PHRASES.saved); }
  const since = daysSinceLast();
  if (since !== null && since >= 3) return `${since}-й день без супа. Мне начинать переживать?`;
  if (since === 2 && recordStreak() >= 2) return pick(PHRASES.broken);
  return pick(PHRASES.notYet);
}

/* размер тарелки под свободное место: короткая фраза, тарелка крупнее; длинная, мельче */
function fitHero() {
  const card = document.getElementById('today-card');
  if (!card || !card.offsetHeight) return;
  const ph = document.getElementById('phrase');
  /* фраза не длиннее трёх строк: берём самый крупный кегль, при котором она влезает */
  for (const [fs, lh] of [[40, 44], [32, 40], [28, 32], [24, 28]]) {
    ph.style.fontSize = fs + 'px'; ph.style.lineHeight = lh + 'px';
    if (ph.offsetHeight <= lh * 3) break;
  }
  const eaten = card.classList.contains('has-eaten');
  const phraseBottom = ph.offsetTop + ph.offsetHeight;
  let hb = eaten ? 136 : 40;
  let size;
  if (eaten) size = (card.offsetHeight - phraseBottom - 16 - 60 - hb) / 0.76;      /* облачко сразу под фразой */
  else size = (card.offsetHeight - phraseBottom + 24 - hb) / 0.855;              /* край тарелки чуть заходит на фразу */
  const [min, max] = eaten ? [300, 440] : [360, 460];
  /* если места больше, чем нужно самой крупной тарелке, чуть поднимаем её вместе с облачком (до 48px) */
  if (size > max) hb += Math.min(48, Math.round((size - max) * (eaten ? 0.76 : 0.855) / 4) * 4);
  size = Math.round(Math.min(max, Math.max(min, size)) / 4) * 4;
  card.style.setProperty('--hs', size + 'px');
  card.style.setProperty('--hb', hb + 'px');
}

/* ---------- мем или факт дня ---------- */
/* выбирается один раз на день и сохраняется; повторов нет, пока не покажется всё */
function treatFor(k) {
  if (state.treats[k]) return state.treats[k];
  const entry = state.log[k];
  if (!entry) return null;
  const left = (all, seen) => all.map((_, i) => i).filter(i => !seen.includes(i));
  const any = a => a[Math.floor(Math.random() * a.length)];
  let mLeft = left(DAILY_MEMES, state.seenM);
  if (!mLeft.length) { state.seenM = []; mLeft = left(DAILY_MEMES, []); }
  let fLeft = left(FACTS, state.seenF);
  if (!fLeft.length) { state.seenF = []; fLeft = left(FACTS, []); }
  const about = fLeft.filter(i => FACTS[i].s === entry.name);
  let t;
  if (mLeft.length && Math.random() < 0.5) {
    const i = any(mLeft); state.seenM.push(i);
    t = { type: 'meme', src: DAILY_MEMES[i] };
  } else {
    const i = any(about.length && Math.random() < 0.6 ? about : fLeft); state.seenF.push(i);
    t = { type: 'fact', text: FACTS[i].t };
  }
  state.treats[k] = t;
  save();
  return t;
}
function memeFailed(k) {
  const i = FACTS.findIndex((f, j) => !state.seenF.includes(j));
  const j = i < 0 ? Math.floor(Math.random() * FACTS.length) : i;
  state.seenF.push(j);
  state.treats[k] = { type: 'fact', text: FACTS[j].t };
  save(); closeOverlay(); showTreat(k);
}
function showTreat(k) {
  const t = treatFor(k);
  if (!t) return;
  overlay.innerHTML = `<div class="gift-stage pop" role="dialog" aria-modal="true">
    ${t.type === 'meme'
      ? `<p class="muted">Мем дня</p><h2 class="display-m">${nb('Надеюсь, поможет...')}</h2>
         <div class="treat-img"><img src="${t.src}" alt="Мем про суп" onerror="memeFailed('${k}')"></div>
         <button class="main-btn" onclick="closeOverlay()">Ору</button>`
      : `<p class="muted">Факт дня</p><h2 class="display-m">${nb('А ты нал?')}</h2>
         <div class="treat-fact"><p class="h3">${esc(nb(t.text))}</p></div>
         <button class="main-btn" onclick="closeOverlay()">Теперь знаю</button>`}
  </div>`;
  overlay.classList.add('open');
}

/* ---------- жизнь ---------- */
function claimLife() {
  const m = chains().unclaimed[0];
  if (!m) return;
  state.claimed = state.claimed || {};
  state.claimed[m] = keyOf(today());
  save(); renderAll();
  const lv = chains().lives;
  overlay.innerHTML = `<div class="gift-stage pop" role="dialog" aria-modal="true">
    <p class="muted">${nb(`За ${LIVE_EVERY} дней супа подряд`)}</p>
    <h2 class="display-m">${nb('+1 жизнь')}</h2>
    <div class="lives" style="justify-content:center;margin:24px 0">${heart(true).replace('class="heart', 'class="heart big')}</div>
    <p>${nb('Если пропустишь день, сможешь потратить её, и серия не обнулится')}</p>
    <p class="muted" style="margin:8px 0 24px">${nb(`В копилке: ${lv}`)}</p>
    <button class="main-btn" onclick="closeOverlay()">Положить в копилку</button>
  </div>`;
  overlay.classList.add('open');
}

/* спросить про жизнь, если есть пропущенный день и жизнь в копилке */
function askLife() {
  const p = chains().pending;
  if (!p || overlay.classList.contains('open')) return;
  const d = fromKey(p.day);
  const when = p.days > 1 ? `С ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} супа не было` : `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} супа не было`;
  const ask = p.canSave
    ? (p.days > 1 ? `Пропущено дней: ${p.days}. Потратишь ${p.days} ${plural(p.days, 'жизнь', 'жизни', 'жизней')}?` : 'Используешь жизнь?')
    : (p.lives ? `Жизней не хватает: нужно ${p.days}, в копилке ${p.lives}` : 'Жизней в копилке нет');
  overlay.innerHTML = `<div class="gift-stage pop" role="dialog" aria-modal="true">
    <p class="muted">${nb(when)}</p>
    <h2 class="display-m">${nb('Кто-то что-то не доел...')}</h2>
    <div class="lives" style="justify-content:center;margin:24px 0">${heart(p.canSave).replace('class="heart', 'class="heart big')}</div>
    <p class="h3">${nb(`Стрик из ${p.run} ${daysWord(p.run)} разрушен. ${ask}`)}</p>
    ${p.canSave ? `<p class="muted" style="margin-top:8px">${nb(`В копилке: ${p.lives}`)}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:24px">
      ${p.canSave ? `<button class="main-btn" onclick="decideLife('${p.day}', 'use')">${nb('Да, спасти серию')}</button>` : ''}
      <button class="main-btn" style="${p.canSave ? 'background:var(--bg)' : ''}" onclick="iAte('${p.day}')">${nb('Я вообще-то ел')}</button>
      <button class="link" onclick="decideLife('${p.day}', 'skip')">${nb(p.canSave ? 'Нет, начну заново' : 'Ладно, начну заново')}</button>
    </div>
  </div>`;
  overlay.classList.add('open');
}
/* «я вообще-то ел»: открыть выбор супа сразу на пропущенный день */
function iAte(day) {
  closeOverlay();
  openSheet(day, true);
}
function decideLife(day, choice) {
  state.saves = state.saves || {};
  state.saves[day] = choice;
  save(); closeOverlay(); phraseCache = null; renderAll();
  setTimeout(askLife, 300);
}

/* ---------- подарок ---------- */
function openGift(i) {
  overlay.innerHTML = `<div class="gift-stage" role="dialog" aria-modal="true">
    <p class="muted">${nb('Тебе подарок')}</p>
    <h2 class="display-m">${nb(`За ${PRIZES[i - 1].days} ${daysWord(PRIZES[i - 1].days)} супа подряд`)}</h2>
    <div class="shake" id="box-wrap"><img class="box" src="${IMG('gift')}" alt="" style="object-fit:contain" onerror="this.outerHTML=BOX"></div>
    <button class="main-btn" id="open-box">Открыть</button>
  </div>`;
  overlay.classList.add('open');
  document.getElementById('open-box').onclick = () => {
    if (!state.opened.includes(i)) state.opened.push(i);
    save(); renderAll(); showPrize(i);
  };
}
function showPrize(i) {
  const pr = PRIZES[i - 1];
  overlay.innerHTML = `<div class="gift-stage pop" role="dialog" aria-modal="true">
    <p class="muted">${nb(`Подарок за ${pr.days} ${daysWord(pr.days)} подряд`)}</p>
    <h2 class="display-m">${nb(`Это тебе, ${nickToday}`)}</h2>
    <div class="coupon"><span class="caption">Купон</span><p class="display-m">${esc(nb(pr.text))}</p><span class="caption">${nb('Покажи Ане, чтобы получить')}</span></div>
    <button class="main-btn" onclick="closeOverlay()">Забрать</button>
    ${state.lastBackup !== keyOf(today()) ? `<button class="link" style="margin-top:8px" onclick="exportBackup()">${nb('Такую серию жалко потерять. Сохранить копию')}</button>` : ''}
  </div>`;
  overlay.classList.add('open');
}

/* ---------- кнопки ---------- */
document.getElementById('eat-btn').addEventListener('click', e => {
  e.currentTarget.classList.remove('bounce'); void e.currentTarget.offsetWidth; e.currentTarget.classList.add('bounce');
  setTimeout(() => openSheet(keyOf(today()), true), 160);
});
document.getElementById('bubble').addEventListener('click', () => showTreat(keyOf(today())));
document.getElementById('hero').addEventListener('click', () => { if (state.log[keyOf(today())]) showTreat(keyOf(today())); });
/* после текущего года идёт «За всё время» */
document.getElementById('year-prev').addEventListener('click', () => { baseYear = baseYear === 'all' ? today().getFullYear() : baseYear - 1; renderBase(); });
document.getElementById('year-next').addEventListener('click', () => { baseYear = baseYear === today().getFullYear() ? 'all' : baseYear + 1; renderBase(); });
document.getElementById('cal-prev').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderStats(); });
document.getElementById('cal-next').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderStats(); });

/* ---------- копия данных ---------- */
/* копия данных: открывает меню «Поделиться» (Файлы, Телеграм...). Дату копии запоминаем, только если он реально сохранил */
async function exportBackup() {
  const stamp = () => { state.lastBackup = keyOf(today()); save(); renderToday(); };
  const data = Object.assign({}, state, { lastBackup: keyOf(today()) });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const name = `supchik-${keyOf(today())}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Копия Супчика' }); stamp(); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  stamp(); return true;
}
/* напоминание: раз в 30 дней с последней копии (или с первого супа). Висит, пока не сохранит */
const BACKUP_EVERY = 30;
function backupDue() {
  const keys = Object.keys(state.log).sort();
  if (!keys.length) return false;
  const from = state.lastBackup || keys[0];
  return Math.round((today() - fromKey(from)) / 86400000) >= BACKUP_EVERY;
}
document.getElementById('export-btn').addEventListener('click', exportBackup);
document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.log) throw new Error();
    if (!confirm('Заменить текущие данные копией?')) return;
    state = Object.assign({ custom: [], opened: [], recent: [], treats: {}, seenM: [], seenF: [], claimed: {}, saves: {} }, data);
    save(); phraseCache = null; renderAll();
    alert('Готово, всё на месте');
  } catch (err) { alert('Это не похоже на копию Супчика'); }
  e.target.value = '';
});

/* новый день: если приложение висело открытым со вчера */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { rnd = seeded(keyOf(today())); nickToday = pick(NICKS); phraseCache = null; renderAll(); setTimeout(askLife, 300); }
});

renderAll();
setTimeout(askLife, 600);

/* просим браузер не чистить данные приложения при нехватке места */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* офлайн: сервис-воркер сохраняет приложение в телефоне и тихо докачивает все картинки и мемы */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
    /* докачиваем через 15 секунд, чтобы не мешать первой загрузке на медленном интернете */
    const imgs = [...new Set([...Object.values(SOUP_IMG), ...CATS.map(c => c.id), 'empty', 'gift', 'heart'])].map(IMG);
    setTimeout(() => reg.active && reg.active.postMessage({ type: 'warm', urls: [...imgs, ...DAILY_MEMES] }), 15000);
  }).catch(() => {});
}
</script>
</body>
